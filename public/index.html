<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplicación bancaria en línea - Gestiona tus cuentas y transacciones de manera segura" />
  <meta name="theme-color" content="#1e3a5f" />
  
  <title>Banking App - Acceso Seguro</title>
  
  <style>
    :root {
      --color-primary: #1e3a5f;
      --color-secondary: #4a90a4;
      --color-accent: #f5a623;
      --color-background: #f8f9fa;
      --color-text: #212529;
      --color-text-light: #6c757d;
      --color-success: #28a745;
      --color-error: #dc3545;
      --color-warning: #ffc107;
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --border-radius: 0.375rem;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition-fast: 150ms ease-in-out;
      --transition-normal: 250ms ease-in-out;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--color-background);
      color: var(--color-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Skip link para navegación por teclado */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--color-primary);
      color: white;
      padding: var(--spacing-sm) var(--spacing-md);
      z-index: 1000;
      text-decoration: none;
      transition: top var(--transition-fast);
    }

    .skip-link:focus {
      top: 0;
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* Estilos para lectores de pantalla */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus visible para accesibilidad */
    :focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* Reducir movimiento para usuarios que lo prefieren */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Alto contraste */
    @media (prefers-contrast: high) {
      :root {
        --color-background: #ffffff;
        --color-text: #000000;
        --color-primary: #000080;
        --border-radius: 0;
      }

      a, button {
        border: 2px solid currentColor;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  
  <div id="root" role="application" aria-label="Aplicación bancaria">
    <!-- React mount point -->
  </div>
  
  <noscript>
    <div role="alert" style="padding: 2rem; text-align: center; background: #fff3cd; border: 1px solid #ffc107;">
      <p style="margin: 0; font-weight: bold;">JavaScript requerido</p>
      <p style="margin: 0.5rem 0 0;">Esta aplicación requiere JavaScript para funcionar. Por favor, habilite JavaScript en su navegador.</p>
    </div>
  </noscript>
  
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
